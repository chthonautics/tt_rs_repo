# Development run: 1-2k routes, for the architecture comparison of the ML phase.
# Same mixture and physics as the smoke run, larger sample and
# a finer simulation step.

run_name: dev_v1
master_seed: 20261019
n_routes: 1500

trailers:
  fidelity: quasi_static

noise:
  input:
    enabled: true
    default_sigma: 0.03
    per_parameter:
      tractor_mass_kg: 0.02
      trailer_mass_kg: 0.04
      axle_crr: 0.05
      drag_coef: 0.03
      frontal_area_m2: 0.02
  output:
    enabled: true
    sigma: 0.015

sim:
  dt_base_s: 0.5
  max_substeps_per_segment: 120
  trace_miss_opts: Error
  max_route_retries: 6

output:
  dir: ../datasets
  train_fraction: 0.8
  stratify: [vehicle_class, n_trailers]
