# Vehicle-class preset: long_haul
# Class 8 / EU 40 t: fast, heavy, single trailer only.
#
# Read by trailer_sim.config.default_config(); this file is the source of truth
# for the built-in mixture. Fields omitted here fall back to the ClassConfig
# defaults in config.py. Edit values freely, then re-run the generator.

# --- sampling mixture -----------------------------------------------
weight: 0.2
n_trailers: [1]

# --- static physical parameters (annex A1.2 fields; sampled ranges) -
tractor_mass_kg: [8000.0, 12000.0]
trailer_mass_kg: [10000.0, 25000.0]
axle_crr: [0.005, 0.007]
drag_coef: [0.5, 0.6]
frontal_area_m2: [9.0, 11.0]

# --- route synthesis ------------------------------------------------
segments: [15, 40]
seg_len_m: [250.0, 500.0]
speed_mps: [22.0, 33.0]
creep_speed_mps: 2.5
grade_max: 0.06
grade_amplitude: 0.015
grade_correlation_segments: 5.0
turn_rad: [0.0, 0.05]
turn_probability: 0.15
dwell_fraction: 0.02
dwell_speed_frac: 0.25
accel_max_mps2: 0.35
max_rel_speed_change: 0.25
net_elev_drop_max_m: 120.0

# --- simplified trailer physics -------------------------------------
n_trailer_axles: 3
hitch_to_axle_m: 5.0
trailer_track_m: 2.6
trailer_cg_height_m: 1.6
trailer_wheelbase_m: 6.0
tongue_weight_frac: 0.3
tractor_cg_height_m: 1.2
tractor_wheelbase_m: 4.5
axle_crr_by_position: [0.005, 0.006, 0.0065]
trailer_drag_coef: 0.55
trailer_frontal_area_m2: [9.0, 10.5]
wake_factor: 0.12

# --- powertrain (FASTSim vehicle assembly) --------------------------
em_pwr_kw: [300.0, 450.0]
battery_kwh: [300.0, 620.0]
wheel_radius_m: 0.52
wheel_inertia_kg_m2: 55.0

# --- battery pre-conditioning --------------------------------
conditioning_headroom_j: 40000000.0
